name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 零依赖：不需要 npm install
      - name: 表一致性 / 规则重复 / 渲染冒烟 / 版本与文案
        run: node scripts/check.mjs
      - name: 语法检查
        run: |
          node --check client.js
          node --check index.js
